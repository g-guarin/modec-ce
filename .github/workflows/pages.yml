name: Informe en GitHub Pages

# Manual a propósito: requiere activar Pages (Settings → Pages → Source: GitHub Actions).
# Publica la simulación, la sensibilidad y las bitácoras de piloto versionadas en evidencia/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar informe
        run: |
          python -B -m modec_ce simular
          python -B -m modec_ce sensibilidad
          python -B -m modec_ce informe
          mkdir -p _site
          cp resultados/informe.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Mitigación, no cura. Dos corridas de seis fallaron con «No artifacts named
      # "github-pages" were found for this workflow run», pese a que el artefacto sí se había
      # subido (la corrida lo lista). El propio mensaje de GitHub lo atribuye a un fallo al
      # consultar los metadatos del artefacto y recomienda reintentar más tarde: es una carrera
      # entre la subida y su visibilidad en la API, fuera de este repositorio.
      # La espera reduce esa ventana; no la elimina. Si vuelve a fallar, el remedio sigue siendo
      # relanzar el flujo, y conviene quitar esta espera en vez de alargarla: no es nuestra.
      - name: Esperar a que el artefacto sea visible en la API
        run: sleep 15

      - id: despliegue
        uses: actions/deploy-pages@v5
